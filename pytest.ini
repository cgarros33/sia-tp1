# Configuración de la suite de regresión (Fase 3).
#
# NO hay ningún plugin ni opción de timeout, y es a propósito: todo corte de una
# corrida es por `max_nodos`, que es determinístico. Un test que depende del
# reloj falla en la máquina lenta de un integrante y pasa en la del otro, y eso
# destruye la confianza en la suite entera.
[pytest]
testpaths = tests
addopts = -ra
markers =
    lento: tarda más de un par de segundos (toca N4, N5 o IDDFS sobre N2/N3). Se saltea con -m "not lento".
    completo: corridas extremadamente pesadas de la suite completa (ej. BFS en N4/N5 sin poda). Se saltea con -m "not completo".
